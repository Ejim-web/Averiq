<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Averiq — Tap to Mine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0e17;
            color: #e8edf5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #12d8b5, #f5b62e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8a9bb5;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(17, 25, 39, 0.85);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 12px;
        }
        .balance {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #12d8b5, #f5b62e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-label {
            color: #5a6f8a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .cloud-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 40% 35%, #1a3a4a, #0d1a2a);
            cursor: pointer;
            font-size: 80px;
            transition: transform 0.1s ease;
            box-shadow: 0 0 40px rgba(18, 216, 181, 0.05);
            margin: 10px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .cloud-btn:active {
            transform: scale(0.92);
        }
        .cloud-btn .label {
            font-size: 12px;
            color: #8a9bb5;
            font-weight: 700;
            margin-top: 5px;
        }
        .wallet-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(145deg, #12d8b5, #0d8a72);
            color: #0a0e17;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .wallet-btn:active {
            transform: scale(0.97);
        }
        .wallet-btn.connected {
            background: rgba(18, 216, 181, 0.08);
            color: #12d8b5;
            border: 1px solid rgba(18, 216, 181, 0.15);
        }
        .wallet-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(13, 21, 32, 0.8);
            color: #8a9bb5;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .status.success {
            border-left-color: #37df6d;
        }
        .status.error {
            border-left-color: #ff6675;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .stat {
            background: rgba(13, 21, 32, 0.8);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .stat .value {
            font-size: 18px;
            font-weight: 700;
            display: block;
        }
        .stat .value.accent {
            color: #12d8b5;
        }
        .stat .value.gold {
            color: #f5b62e;
        }
        .stat .value.green {
            color: #37df6d;
        }
        .stat .label {
            font-size: 9px;
            color: #5a6f8a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .energy-bar {
            height: 4px;
            background: rgba(13, 21, 32, 0.8);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        .energy-bar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #12d8b5, #f5b62e);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #5a6f8a;
            margin-top: 4px;
        }
        .wallet-address {
            font-family: monospace;
            font-size: 11px;
            color: #5a6f8a;
            word-break: break-all;
            padding: 8px;
            background: rgba(13, 21, 32, 0.8);
            border-radius: 8px;
            margin-top: 8px;
        }
        .wallet-address .short {
            color: #12d8b5;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">☁️</div>
        <h1>Averiq</h1>
        <div class="subtitle">Tap the cloud to mine ₳</div>

        <div class="card">
            <div class="balance-label">💰 YOUR BALANCE</div>
            <div class="balance" id="balanceDisplay">0.0000</div>
        </div>

        <button class="cloud-btn" id="cloudBtn" onclick="tapCloud()">
            ☁️
            <span class="label">TAP TO MINE</span>
        </button>

        <div class="card">
            <div class="stats">
                <div class="stat">
                    <span class="value accent" id="tapCount">0</span>
                    <span class="label">Taps</span>
                </div>
                <div class="stat">
                    <span class="value gold" id="minedDisplay">0.0000</span>
                    <span class="label">Mined</span>
                </div>
                <div class="stat">
                    <span class="value green" id="energyDisplay">100%</span>
                    <span class="label">Energy</span>
                </div>
            </div>
            <div class="energy-bar">
                <div class="fill" id="energyFill" style="width:100%"></div>
            </div>
            <div class="energy-text">
                <span>0%</span>
                <span id="energyStatus">Full Energy!</span>
                <span>100%</span>
            </div>
        </div>

        <div class="card">
            <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">
                Connect Phantom Wallet
            </button>
            <div class="wallet-address" id="walletAddress">
                <span class="short">💡 No wallet connected</span>
            </div>
            <div class="status" id="statusMessage">☁️ Click connect to start mining!</div>
        </div>
    </div>

    <script>
        // ============================================================
        // AVERIQ — ONE CLICK CONNECT (Like Notcoin, Hamster, etc.)
        // ============================================================

        let wallet = null;
        let isConnecting = false;

        let balance = 0;
        let claimable = 0;
        let totalEarned = 0;
        let tapCount = 0;
        let tapEnergy = 100;
        let tapReward = 0.0005;
        let tapMined = 0;

        let energyRegenTimer = null;

        const STORAGE_KEY = 'averiq_data';
        const WALLET_KEY = 'averiq_wallet';

        // ============================================================
        // PHANTOM - ONE CLICK CONNECT
        // ============================================================

        function getPhantom() {
            if (window.phantom && window.phantom.solana) {
                return window.phantom.solana;
            }
            if (window.solana && window.solana.isPhantom) {
                return window.solana;
            }
            return null;
        }

        function connectWallet() {
            const button = document.getElementById("walletBtn");
            const status = document.getElementById("statusMessage");

            if (isConnecting) {
                status.textContent = "⏳ Connecting...";
                return;
            }

            const phantom = getPhantom();

            if (!phantom) {
                status.textContent = "⚠️ Open this in Phantom browser";
                status.className = "status error";
                return;
            }

            // ✅ ALREADY CONNECTED? Just show status
            if (phantom.isConnected && phantom.isConnected()) {
                const pubKey = phantom.publicKey;
                if (pubKey) {
                    handleConnection(pubKey);
                    return;
                }
            }

            // ✅ ONE CLICK CONNECT - Opens Phantom popup instantly
            isConnecting = true;
            button.disabled = true;
            button.textContent = "Connecting...";
            status.textContent = "🔄 Opening Phantom...";
            status.className = "status";

            phantom.connect({ onlyIfTrusted: false })
                .then(res => {
                    if (res && res.publicKey) {
                        handleConnection(res.publicKey);
                        button.textContent = "✅ Connected";
                        button.className = "wallet-btn connected";
                        status.textContent = "✅ Wallet connected! Start mining!";
                        status.className = "status success";
                    } else {
                        throw new Error("No public key");
                    }
                })
                .catch(err => {
                    console.error(err);
                    if (err.code === 4001) {
                        status.textContent = "❌ Connection rejected. Try again.";
                    } else {
                        status.textContent = "❌ Failed. Try again.";
                    }
                    status.className = "status error";
                    button.textContent = "Connect Phantom Wallet";
                    button.className = "wallet-btn";
                    button.onclick = connectWallet;
                    button.disabled = false;
                })
                .finally(() => {
                    isConnecting = false;
                });
        }

        function handleConnection(publicKey) {
            const address = publicKey.toBase58();

            wallet = {
                publicKey: publicKey,
                address: address,
                connected: true
            };

            localStorage.setItem(WALLET_KEY, address);

            const short = address.slice(0, 6) + "..." + address.slice(-6);
            document.getElementById("walletAddress").innerHTML = 
                `<span class="short">🔗 ${short}</span><br><span style="font-size:9px;color:#5a6f8a;">${address}</span>`;

            loadData();
            updateUI();

            // ✅ Listen for account changes (like other apps)
            const phantom = getPhantom();
            if (phantom) {
                phantom.on('accountChanged', (newPubKey) => {
                    if (!newPubKey) {
                        disconnectWallet();
                        return;
                    }
                    const newAddress = newPubKey.toBase58();
                    wallet = {
                        publicKey: newPubKey,
                        address: newAddress,
                        connected: true
                    };
                    localStorage.setItem(WALLET_KEY, newAddress);
                    loadData();
                    updateUI();
                    document.getElementById("statusMessage").textContent = "🔄 Account changed";
                });

                phantom.on('disconnect', () => {
                    disconnectWallet();
                });
            }
        }

        function disconnectWallet() {
            if (!wallet) return;
            saveData();

            const phantom = getPhantom();
            if (phantom && phantom.disconnect) {
                try { phantom.disconnect(); } catch (e) {}
            }

            wallet = null;
            localStorage.removeItem(WALLET_KEY);

            const button = document.getElementById("walletBtn");
            button.textContent = "Connect Phantom Wallet";
            button.className = "wallet-btn";
            button.onclick = connectWallet;
            button.disabled = false;

            document.getElementById("walletAddress").innerHTML = `<span class="short">💡 No wallet connected</span>`;
            document.getElementById("statusMessage").textContent = "Wallet disconnected.";
            document.getElementById("statusMessage").className = "status";

            loadGuestData();
        }

        // ============================================================
        // AUTO-CONNECT ON PAGE LOAD (Like other apps)
        // ============================================================

        function autoConnect() {
            const savedWallet = localStorage.getItem(WALLET_KEY);
            if (!savedWallet) {
                loadGuestData();
                return;
            }

            const phantom = getPhantom();
            if (!phantom) {
                loadGuestData();
                return;
            }

            // ✅ Already connected? Use it
            if (phantom.isConnected && phantom.isConnected()) {
                const pubKey = phantom.publicKey;
                if (pubKey && pubKey.toBase58() === savedWallet) {
                    handleConnection(pubKey);
                    return;
                }
            }

            // ✅ Auto-connect silently (like other apps)
            phantom.connect({ onlyIfTrusted: true })
                .then(res => {
                    if (res && res.publicKey) {
                        const address = res.publicKey.toBase58();
                        if (address === savedWallet) {
                            handleConnection(res.publicKey);
                            document.getElementById("statusMessage").textContent = "🔗 Wallet reconnected!";
                            document.getElementById("statusMessage").className = "status success";
                        }
                    }
                })
                .catch(() => {
                    loadDataByAddress(savedWallet);
                });
        }

        // ============================================================
        // DATA STORAGE
        // ============================================================

        function getKey() {
            if (wallet && wallet.address) {
                return STORAGE_KEY + '_' + wallet.address;
            }
            return STORAGE_KEY + '_guest';
        }

        function saveData() {
            try {
                const data = {
                    balance: balance,
                    claimable: claimable,
                    totalEarned: totalEarned,
                    tapCount: tapCount,
                    tapMined: tapMined,
                    tapEnergy: tapEnergy,
                };
                localStorage.setItem(getKey(), JSON.stringify(data));
            } catch (e) {}
        }

        function loadData() {
            if (!wallet) return;
            try {
                const data = localStorage.getItem(STORAGE_KEY + '_' + wallet.address);
                if (data) applyData(JSON.parse(data));
            } catch (e) {}
        }

        function loadDataByAddress(address) {
            try {
                const data = localStorage.getItem(STORAGE_KEY + '_' + address);
                if (data) {
                    applyData(JSON.parse(data));
                    updateUI();
                }
            } catch (e) {}
        }

        function loadGuestData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY + '_guest');
                if (data) applyData(JSON.parse(data));
            } catch (e) {}
        }

        function applyData(data) {
            balance = data.balance || 0;
            claimable = data.claimable || 0;
            totalEarned = data.totalEarned || 0;
            tapCount = data.tapCount || 0;
            tapMined = data.tapMined || 0;
            tapEnergy = data.tapEnergy || 100;
            updateUI();
        }

        // ============================================================
        // GAME MECHANICS
        // ============================================================

        function tapCloud() {
            if (tapEnergy < 3) {
                document.getElementById("statusMessage").textContent = "⏳ Energy low! Wait...";
                return;
            }

            const btn = document.getElementById("cloudBtn");
            btn.style.transform = 'scale(0.92)';
            setTimeout(() => btn.style.transform = 'scale(1)', 100);

            const reward = tapReward * (1 + (tapCount / 500) * 0.2);

            tapMined += reward;
            balance += reward;
            claimable += reward;
            totalEarned += reward;
            tapCount++;
            tapEnergy = Math.max(0, tapEnergy - 0.8);

            updateUI();
            saveData();
            updateEnergy();

            if (!energyRegenTimer) startEnergyRegen();

            const status = document.getElementById("statusMessage");
            status.textContent = `+${reward.toFixed(4)} ₳`;
            status.className = "status success";
            setTimeout(() => {
                if (wallet && wallet.connected) {
                    status.textContent = "✅ Mining... Keep tapping!";
                    status.className = "status success";
                } else {
                    status.textContent = "☁️ Tap to mine! Connect wallet to save.";
                    status.className = "status";
                }
            }, 600);
        }

        function updateEnergy() {
            const pct = Math.round(tapEnergy);
            document.getElementById("energyDisplay").textContent = pct + '%';
            document.getElementById("energyFill").style.width = pct + '%';

            const txt = document.getElementById("energyStatus");
            if (pct >= 100) txt.textContent = 'Full Energy!';
            else if (pct > 50) txt.textContent = 'Energized';
            else if (pct > 20) txt.textContent = 'Recharging...';
            else txt.textContent = 'Low Energy!';
        }

        function startEnergyRegen() {
            if (energyRegenTimer) clearInterval(energyRegenTimer);
            energyRegenTimer = setInterval(() => {
                if (tapEnergy < 100) {
                    tapEnergy = Math.min(100, tapEnergy + 0.8);
                    updateEnergy();
                    if (tapEnergy >= 100) {
                        clearInterval(energyRegenTimer);
                        energyRegenTimer = null;
                    }
                } else {
                    clearInterval(energyRegenTimer);
                    energyRegenTimer = null;
                }
            }, 500);
        }

        function updateUI() {
            document.getElementById("balanceDisplay").textContent = balance.toFixed(4);
            document.getElementById("tapCount").textContent = tapCount;
            document.getElementById("minedDisplay").textContent = tapMined.toFixed(4);
            updateEnergy();
        }

        // ============================================================
        // START
        // ============================================================

        document.addEventListener("DOMContentLoaded", function() {
            autoConnect();
            if (!wallet) loadGuestData();
            updateUI();

            if (wallet && wallet.connected) {
                document.getElementById("statusMessage").textContent = "✅ Wallet connected! Start mining!";
                document.getElementById("statusMessage").className = "status success";
            } else if (getPhantom()) {
                document.getElementById("statusMessage").textContent = "🔗 Click 'Connect Phantom Wallet' to start!";
            } else {
                document.getElementById("statusMessage").textContent = "💡 Open this in Phantom browser to connect!";
            }
        });

        // Make functions global
        window.tapCloud = tapCloud;
        window.connectWallet = connectWallet;
        window.disconnectWallet = disconnectWallet;
    </script>
</body>
</html>
