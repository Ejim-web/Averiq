<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Averiq — Tap Cloud to Mine</title>
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111927;
            --bg-card: rgba(17, 25, 39, 0.85);
            --bg-input: #0d1520;
            --text-primary: #e8edf5;
            --text-secondary: #8a9bb5;
            --text-muted: #5a6f8a;
            --border-color: rgba(255, 255, 255, .06);
            --shadow-color: rgba(0, 0, 0, .4);
            --glass-bg: rgba(17, 25, 39, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
            --neumo-shadow: 0 8px 32px rgba(0, 0, 0, .3);
            --accent: #12d8b5;
            --accent-glow: rgba(18, 216, 181, 0.15);
            --gold: #f5b62e;
            --gold-glow: rgba(245, 182, 46, 0.15);
            --red: #ff6675;
            --green: #37df6d;
            --blue: #4a8cff;
            --purple: #9945FF;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100%;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        body {
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            width: 100%;
            max-width: 480px;
            margin: auto;
            min-height: 100vh;
            padding: 0 16px 100px 16px;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
        }
        .brand .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(145deg, var(--accent), #0d8a72);
            display: grid;
            place-items: center;
            color: #0a0e17;
            font-size: 18px;
            font-weight: 900;
        }
        .brand .badge {
            font-size: 9px;
            font-weight: 600;
            background: rgba(18, 216, 181, 0.12);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid rgba(18, 216, 181, 0.15);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .online-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--green);
            background: rgba(55, 223, 109, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(55, 223, 109, 0.12);
        }
        .online-status .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .3;
                transform: scale(0.8);
            }
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--neumo-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        /* ===== BALANCE ===== */
        .balance-display {
            text-align: center;
            padding: 4px 0;
        }
        .balance-display .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-display .amount {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.1s ease;
        }
        .balance-display .amount.pop {
            animation: pop 0.15s ease;
        }
        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
        .balance-display .sub {
            font-size: 12px;
            color: var(--text-muted);
        }
        .balance-display .wallet-status {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .balance-display .wallet-status .link {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }

        /* ===== TAP CLOUD ===== */
        .cloud-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0 8px 0;
            position: relative;
        }
        .cloud-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 40% 35%, #1a3a4a, #0d1a2a);
            cursor: pointer;
            position: relative;
            transition: all 0.08s ease;
            box-shadow: 0 0 40px rgba(18, 216, 181, 0.05), inset 0 0 40px rgba(18, 216, 181, 0.02);
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            overflow: visible;
        }
        .cloud-btn:active {
            transform: scale(0.92);
        }
        .cloud-btn .cloud-icon {
            font-size: 80px;
            line-height: 1;
            transition: all 0.1s ease;
            filter: drop-shadow(0 0 20px rgba(18, 216, 181, 0.1));
            animation: floatCloud 3s ease-in-out infinite;
        }
        .cloud-btn:active .cloud-icon {
            transform: scale(1.15);
        }
        @keyframes floatCloud {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .cloud-btn .cloud-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .cloud-btn .cloud-label .accent {
            color: var(--accent);
        }
        .cloud-btn .cloud-sub {
            font-size: 10px;
            color: var(--text-muted);
        }
        .cloud-btn .cloud-energy {
            position: absolute;
            bottom: 25px;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .cloud-btn .cloud-rings {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 1px solid rgba(18, 216, 181, 0.04);
            pointer-events: none;
        }
        .cloud-btn .cloud-rings::before {
            content: '';
            position: absolute;
            inset: 18px;
            border-radius: 50%;
            border: 1px dashed rgba(18, 216, 181, 0.06);
        }
        .cloud-btn .cloud-rings::after {
            content: '';
            position: absolute;
            inset: 36px;
            border-radius: 50%;
            border: 1px solid rgba(18, 216, 181, 0.03);
        }

        .cloud-btn.mining-active {
            border-color: rgba(18, 216, 181, 0.2);
            box-shadow: 0 0 60px rgba(18, 216, 181, 0.08), inset 0 0 60px rgba(18, 216, 181, 0.04);
            animation: cloudGlow 2s infinite alternate;
        }
        @keyframes cloudGlow {
            0% {
                box-shadow: 0 0 40px rgba(18, 216, 181, 0.05), inset 0 0 40px rgba(18, 216, 181, 0.02);
            }
            100% {
                box-shadow: 0 0 80px rgba(18, 216, 181, 0.12), inset 0 0 60px rgba(18, 216, 181, 0.05);
            }
        }

        /* ===== FLOATING +₳ ANIMATION ===== */
        .float-reward {
            position: fixed;
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 20px rgba(245, 182, 46, 0.3);
            animation: floatUp 0.9s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translateY(-150px) scale(1.2);
            }
        }

        /* ===== PARTICLE BURST ===== */
        .particle-burst {
            position: fixed;
            pointer-events: none;
            z-index: 99;
            border-radius: 50%;
            animation: burstOut 0.6s ease-out forwards;
        }
        @keyframes burstOut {
            0% {
                opacity: 1;
                transform: scale(0);
            }
            100% {
                opacity: 0;
                transform: scale(2);
            }
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .stat-item {
            text-align: center;
            padding: 10px 4px;
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .stat-item .stat-value {
            font-size: 16px;
            font-weight: 700;
            display: block;
        }
        .stat-item .stat-value.accent {
            color: var(--accent);
        }
        .stat-item .stat-value.gold {
            color: var(--gold);
        }
        .stat-item .stat-value.green {
            color: var(--green);
        }
        .stat-item .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== PROGRESS ===== */
        .progress-track {
            height: 4px;
            background: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-track .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* ===== ACTION BUTTONS ===== */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .action-btn {
            padding: 10px 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 10px;
            transition: all 0.3s ease;
            text-align: center;
        }
        .action-btn:active {
            transform: scale(.95);
        }
        .action-btn .icon {
            font-size: 18px;
            display: block;
            margin-bottom: 2px;
        }
        .action-btn.primary {
            border-color: rgba(18, 216, 181, 0.2);
            background: rgba(18, 216, 181, 0.05);
        }

        /* ===== WALLET ===== */
        .wallet-btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 12px;
            background: linear-gradient(145deg, var(--accent), #0d8a72);
            color: #0a0e17;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .wallet-btn:active {
            transform: scale(.97);
        }
        .wallet-btn.connected {
            background: rgba(18, 216, 181, 0.08);
            color: var(--accent);
            border: 1px solid rgba(18, 216, 181, 0.15);
        }
        .wallet-address {
            background: var(--bg-input);
            border-radius: 10px;
            padding: 10px;
            word-break: break-all;
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 8px;
            font-family: monospace;
            border: 1px solid var(--border-color);
        }
        .wallet-address .short {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
        }

        .message {
            padding: 10px;
            margin-top: 10px;
            border-radius: 10px;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.4;
            border-left: 3px solid rgba(18, 216, 181, 0.2);
            border: 1px solid var(--border-color);
        }
        .message.success {
            border-left-color: var(--green);
        }
        .message.error {
            border-left-color: var(--red);
        }
        .message.info {
            border-left-color: var(--gold);
        }

        /* ===== NAV ===== */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(480px, 100%);
            height: 64px;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            z-index: 30;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav button {
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .nav button.active {
            color: var(--accent);
        }
        .nav button .nav-icon {
            font-size: 18px;
            display: block;
            margin-bottom: 2px;
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            width: 100%;
            max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            color: var(--text-primary);
            text-align: center;
            box-shadow: var(--neumo-shadow);
            position: relative;
        }
        .modal-box h2 {
            font-size: 18px;
            margin: 0 0 12px;
        }
        .modal-box input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
        }
        .modal-box input:focus {
            border-color: var(--accent);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            position: absolute;
            top: 10px;
            right: 14px;
        }
        .modal-box .btn-primary {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 12px;
            background: linear-gradient(145deg, var(--accent), #0d8a72);
            color: #0a0e17;
            font-weight: 700;
            font-size: 15px;
            margin-top: 4px;
        }
        .modal-box .btn-secondary {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-top: 8px;
            background: transparent;
            color: var(--text-primary);
            font-weight: 600;
        }
        .modal-box .status-text {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:400px) {
            .cloud-btn {
                width: 180px;
                height: 180px;
            }
            .cloud-btn .cloud-icon {
                font-size: 60px;
            }
            .cloud-btn .cloud-label {
                font-size: 11px;
            }
            .balance-display .amount {
                font-size: 30px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .action-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }
            .action-btn {
                font-size: 9px;
                padding: 8px 2px;
            }
            .action-btn .icon {
                font-size: 16px;
            }
        }
        @media(max-width:360px) {
            .cloud-btn {
                width: 150px;
                height: 150px;
            }
            .cloud-btn .cloud-icon {
                font-size: 48px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .action-grid {
                grid-template-columns: 1fr 1fr;
            }
            .brand .badge {
                display: none;
            }
            .online-status span {
                display: none;
            }
        }

        .hidden {
            display: none !important;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .gap-8 {
            gap: 8px;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header>
            <div class="brand">
                <div class="logo">₳</div>
                <span>Averiq</span>
                <span class="badge">☁️ Tap</span>
            </div>
            <div class="header-actions">
                <div class="online-status">
                    <span class="dot"></span>
                    <span>Live</span>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
            </div>
        </header>

        <main>

            <!-- ===== BALANCE ===== -->
            <div class="card">
                <div class="balance-display">
                    <div class="label">💰 YOUR BALANCE</div>
                    <div class="amount" id="avqBalance">0.0000</div>
                    <div class="sub" id="walletDisplay">₳ Averiq Token</div>
                    <div class="wallet-status" id="walletStatusBar">
                        <span id="walletStatusText">💡 Guest mode — Tap to mine</span>
                        <span class="link" onclick="connectWallet()">Connect Wallet</span>
                    </div>
                </div>
            </div>

            <!-- ===== TAP CLOUD ===== -->
            <div class="card" style="background:transparent;border:none;box-shadow:none;padding:0;">
                <div class="cloud-container">
                    <button class="cloud-btn" id="cloudBtn" onclick="tapCloud()">
                        <div class="cloud-rings"></div>
                        <span class="cloud-icon">☁️</span>
                        <span class="cloud-label"><span class="accent">TAP</span> THE CLOUD</span>
                        <span class="cloud-sub" id="tapStatus">🟢 Tap to mine</span>
                        <span class="cloud-energy" id="tapEnergy">⚡ 100%</span>
                    </button>
                </div>
            </div>

            <!-- ===== STATS ===== -->
            <div class="card">
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value accent" id="statTaps">0</span>
                        <span class="stat-label">Taps</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value gold" id="statMined">0.0000</span>
                        <span class="stat-label">Mined</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value green" id="statEnergy">100%</span>
                        <span class="stat-label">Energy</span>
                    </div>
                </div>
                <div class="progress-track">
                    <div class="bar" id="tapProgress"></div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);margin-top:4px;">
                    <span>0%</span>
                    <span id="tapStatusText">Ready</span>
                    <span>100%</span>
                </div>
            </div>

            <!-- ===== ACTION BUTTONS ===== -->
            <div class="action-grid">
                <button class="action-btn primary" onclick="startAutoTap()">
                    <span class="icon">⏱️</span>
                    Auto-Tap
                </button>
                <button class="action-btn" onclick="checkIn()">
                    <span class="icon">✅</span>
                    Check-In
                </button>
                <button class="action-btn" onclick="claimRewards()">
                    <span class="icon">🎁</span>
                    Claim
                </button>
                <button class="action-btn" onclick="showSendModal()">
                    <span class="icon">📤</span>
                    Send
                </button>
            </div>

            <!-- ===== WALLET ===== -->
            <div class="card">
                <div class="flex-between">
                    <span style="font-weight:600;font-size:13px;">👛 Wallet</span>
                    <span id="walletStatus" style="font-size:11px;color:var(--text-muted);">Guest mode</span>
                </div>
                <button class="wallet-btn" type="button" onclick="connectWallet()" id="walletButton">
                    Connect Phantom Wallet
                </button>
                <div class="wallet-address" id="walletAddress">
                    <div class="short">💡 Guest account</div>
                    <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">Connect wallet to claim rewards</div>
                </div>
                <div class="message" id="appMessage">☁️ Tap the cloud to mine! Connect wallet to claim your ₳.</div>
            </div>

        </main>

    </div>

    <!-- ===== NAV ===== -->
    <nav class="nav">
        <button class="active" type="button">
            <span class="nav-icon">⌂</span>Home
        </button>
        <button type="button" onclick="showSendModal()">
            <span class="nav-icon">📤</span>Send
        </button>
        <button type="button" onclick="claimRewards()">
            <span class="nav-icon">🎁</span>Claim
        </button>
        <button type="button" onclick="connectWallet()">

    <script>
        /* ============================================================
           AVERIQ — TAP CLOUD TO MINE (No Wallet Required)
           ============================================================ */

        const AVQ_MINT = "Ff6oxq9jqbhyJTBre56KtXLCuUFKixa6v5EN2qCAXX36";
        const DEVNET_RPC = "https://api.devnet.solana.com";

        let connectedWallet = null;
        let web3 = null;
        let splToken = null;
        let librariesPromise = null;
        let isConnecting = false;
        let isGuest = true;
        let guestId = 'guest_' + Date.now();

        // State
        let balance = 0;
        let claimable = 0;
        let totalEarned = 0;
        let totalClaimed = 0;
        let sessions = 0;
        let checks = 0;
        let streak = 0;
        let lastCheckIn = null;

        // Tap state
        let tapCount = 0;
        let tapEnergy = 100;
        let tapReward = 0.0005;
        let tapMined = 0;
        let isAutoTapping = false;
        let autoTapTimer = null;
        let energyRegenTimer = null;

        const CHECKIN_REWARD = 0.25;
        const CLAIM_REWARD = 10;
        const GUEST_KEY = 'averiq_guest_' + guestId;

        let currentTheme = 'dark';

        /* ============================================================
           GUEST STORAGE
           ============================================================ */
        function getGuestState() {
            try {
                const data = localStorage.getItem(GUEST_KEY);
                return data ? JSON.parse(data) : {};
            } catch { return {}; }
        }

        function saveGuestState(state) {
            try {
                localStorage.setItem(GUEST_KEY, JSON.stringify(state));
            } catch {}
        }

        /* ============================================================
           API HELPER (Guest mode uses localStorage)
           ============================================================ */
        async function apiCall(action, data = null, method = 'POST') {
            // If no wallet connected, use localStorage (guest mode)
            if (!connectedWallet) {
                return guestApiCall(action, data, method);
            }

            const url = new URL('/api/earning', window.location.origin);
            const options = {
                method: method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (method === 'POST') {
                options.body = JSON.stringify({ action, ...data });
            } else {
                url.searchParams.set('action', action);
                if (data && data.wallet) {
                    url.searchParams.set('wallet', data.wallet);
                }
            }
            try {
                const response = await fetch(url.toString(), options);
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text.slice(0, 100)}`);
                }
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Server returned non-JSON: ${text.slice(0, 100)}`);
                }
                return await response.json();
            } catch (error) {
                console.error('[AVQ] API error:', error);
                throw error;
            }
        }

        // Guest mode: localStorage only
        function guestApiCall(action, data, method) {
            let state = getGuestState();

            switch (action) {
                case 'status':
                    return {
                        success: true,
                        balance: state.balance || 0,
                        claimable: state.claimable || 0,
                        totalEarned: state.totalEarned || 0,
                        totalClaimed: state.totalClaimed || 0,
                        sessions: state.sessions || 0,
                        checks: state.checks || 0,
                        streak: state.streak || 0,
                        lastCheckIn: state.lastCheckIn || null,
                        hasActiveSession: false,
                        sessionCompleted: false
                    };

                case 'start':
                    state.sessions = (state.sessions || 0) + 1;
                    saveGuestState(state);
                    return { success: true, action: 'start', message: 'Session started' };

                case 'checkin': {
                    const today = new Date().toISOString().slice(0, 10);
                    if (state.lastCheckIn === today) {
                        return { success: false, error: 'Already checked in today' };
                    }
                    const reward = 0.25;
                    state.lastCheckIn = today;
                    state.checks = (state.checks || 0) + 1;
                    state.streak = (state.streak || 0) + 1;
                    state.balance = (state.balance || 0) + reward;
                    state.claimable = (state.claimable || 0) + reward;
                    state.totalEarned = (state.totalEarned || 0) + reward;
                    saveGuestState(state);
                    return {
                        success: true,
                        reward: reward,
                        newBalance: state.balance,
                        streak: state.streak,
                        message: 'Daily check-in complete!'
                    };
                }

                case 'claim': {
                    if (!state.claimable || state.claimable <= 0) {
                        return { success: false, error: 'No rewards to claim' };
                    }
                    const amount = state.claimable;
                    state.balance = (state.balance || 0) + amount;
                    state.totalClaimed = (state.totalClaimed || 0) + amount;
                    state.claimable = 0;
                    saveGuestState(state);
                    return {
                        success: true,
                        amount: amount,
                        newBalance: state.balance,
                        transaction: 'guest_' + Date.now().toString(36),
                        message: 'Claimed ' + amount + ' AVQ'
                    };
                }

                default:
                    return { success: false, error: 'Unknown action' };
            }
        }

        /* ============================================================
           THEME
           ============================================================ */
        function toggleTheme() {
            if (currentTheme === 'dark') {
                document.documentElement.style.setProperty('--bg-primary', '#f0f4f8');
                document.documentElement.style.setProperty('--bg-secondary', '#e8ecf0');
                document.documentElement.style.setProperty('--text-primary', '#1a2332');
                document.documentElement.style.setProperty('--text-secondary', '#4a5a6e');
                document.documentElement.style.setProperty('--text-muted', '#7a8a9e');

                document.getElementById('themeToggle').textContent = '☀️';
                currentTheme = 'light';
            }
        }

        /* ============================================================
           PARTICLES
           ============================================================ */
        let particles = [];
        let particleCanvas, particleCtx;

        function initParticles() {
            particleCanvas = document.getElementById('particles-canvas');
            particleCtx = particleCanvas.getContext('2d');
            resizeParticles();
            window.addEventListener('resize', resizeParticles);
            createParticles();
            animateParticles();
        }

        function resizeParticles() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }

        function createParticles() {
            particles = [];
            const count = Math.min(40, Math.floor(window.innerWidth * window.innerHeight / 12000));
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * particleCanvas.width,
                    y: Math.random() * particleCanvas.height,
                    radius: Math.random() * 2 + 0.5,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2,
                    opacity: Math.random() * 0.2 + 0.03
                });
            }
        }

        function animateParticles() {
            particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > particleCanvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > particleCanvas.height) p.vy *= -1;
                particleCtx.beginPath();
                particleCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                particleCtx.fillStyle = `rgba(18, 216, 181, ${p.opacity})`;
                particleCtx.fill();
            });
            requestAnimationFrame(animateParticles);
        }

        /* ============================================================
           TAP CLOUD
           ============================================================ */
        function tapCloud() {
            // No wallet required — tap immediately!
            if (tapEnergy < 3) {
                showMessage("⏳ Energy low! Wait for recharge.", "info");
                return;
            }

            // Tap feedback
            const btn = document.getElementById('cloudBtn');
            btn.style.transform = 'scale(0.92)';
            setTimeout(() => { btn.style.transform = 'scale(1)'; }, 100);

            // Calculate reward with multiplier based on taps
            const multiplier = 1 + (tapCount / 500) * 0.2;
            const reward = tapReward * multiplier;

            // Add to balances
            tapMined += reward;
            balance += reward;
            claimable += reward;
            totalEarned += reward;
            tapCount++;

            // Reduce energy
            tapEnergy = Math.max(0, tapEnergy - 0.8);

            // Visual effects
            createFloatReward(reward);
            createParticleBurst();
            updateUI();
            saveState();

            // Update cloud status
            updateTapStatus();

            // Auto-start energy regen if not already running
            if (!energyRegenTimer) {
                startEnergyRegen();
            }
        }

        function createFloatReward(amount) {
            const el = document.createElement('div');
            el.className = 'float-reward';
            el.textContent = `+${amount.toFixed(4)} ₳`;
            el.style.left = (Math.random() * 60 + 20) + '%';
            el.style.top = (Math.random() * 30 + 30) + '%';
            document.body.appendChild(el);
            setTimeout(() => { el.remove(); }, 1000);

            // Pop animation on balance
            const balanceEl = document.getElementById('avqBalance');
            balanceEl.classList.remove('pop');
            setTimeout(() => { balanceEl.classList.add('pop'); }, 10);
        }

        function createParticleBurst() {
            const colors = ['#12d8b5', '#f5b62e', '#37df6d', '#4a8cff', '#9945FF'];
            for (let i = 0; i < 6; i++) {
                const el = document.createElement('div');
                el.className = 'particle-burst';
                const size = Math.random() * 8 + 4;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.left = (Math.random() * 80 + 10) + '%';
                el.style.top = (Math.random() * 60 + 20) + '%';
                el.style.borderRadius = '50%';
                el.style.boxShadow = `0 0 10px ${colors[Math.floor(Math.random() * colors.length)]}`;
                document.body.appendChild(el);
                setTimeout(() => { el.remove(); }, 600);
            }
        }

        function startEnergyRegen() {
            if (energyRegenTimer) clearInterval(energyRegenTimer);
            energyRegenTimer = setInterval(() => {
                if (tapEnergy < 100) {
                    tapEnergy = Math.min(100, tapEnergy + 0.8);
                    updateTapStatus();
                    if (tapEnergy >= 100) {
                        clearInterval(energyRegenTimer);
                        energyRegenTimer = null;
                    }
                } else {
                    clearInterval(energyRegenTimer);
                    energyRegenTimer = null;
                }
            }, 500);
        }

        function updateTapStatus() {
            const statusEl = document.getElementById('tapStatus');
            const energyEl = document.getElementById('tapEnergy');
            const progressBar = document.getElementById('tapProgress');
            const statusText = document.getElementById('tapStatusText');
            const statEnergy = document.getElementById('statEnergy');

            const energyPercent = Math.round(tapEnergy);
            statEnergy.textContent = energyPercent + '%';

            if (tapEnergy < 10) {
                statusEl.textContent = '🔴 Energy low!';
                statusEl.style.color = 'var(--red)';
            } else if (tapEnergy < 40) {
                statusEl.textContent = '🟡 Tap to mine';
                statusEl.style.color = 'var(--gold)';
            } else {
                statusEl.textContent = '🟢 Tap to mine';
                statusEl.style.color = 'var(--green)';
            }

            energyEl.textContent = `⚡ ${energyPercent}%`;
            progressBar.style.width = energyPercent + '%';

            if (energyPercent >= 100) {
                statusText.textContent = 'Full Energy!';
            } else if (energyPercent > 50) {
                statusText.textContent = 'Energized';
            } else if (energyPercent > 20) {
                statusText.textContent = 'Recharging...';
            } else {
                statusText.textContent = 'Low Energy!';
            }
        }

        /* ============================================================
           AUTO TAP
           ============================================================ */
        function startAutoTap() {
            if (isAutoTapping) {
                // Stop auto-tap
                isAutoTapping = false;
                if (autoTapTimer) {
                    clearInterval(autoTapTimer);
                    autoTapTimer = null;
                }
                document.querySelector('.action-btn.primary').innerHTML =
                    '<span class="icon">⏱️</span>Auto-Tap';
                showMessage("⏹️ Auto-tap stopped", "info");
                return;
            }

            // Start auto-tap
            isAutoTapping = true;
            document.querySelector('.action-btn.primary').innerHTML =
                '<span class="icon">⏹️</span>Stop Auto';
            showMessage("⏱️ Auto-tap started! Tap the cloud to stop.", "success");

            if (autoTapTimer) clearInterval(autoTapTimer);
            autoTapTimer = setInterval(() => {
                if (tapEnergy < 3) {
                    // Wait for energy
                    return;
                }
                tapCloud();
            }, 300);
        }

        /* ============================================================
           CHECK-IN
           ============================================================ */
        window.checkIn = function() {
            const today = new Date().toISOString().slice(0, 10);
            if (lastCheckIn === today) {
                showMessage("Already checked in today.", "info");
                return;
            }

            const reward = CHECKIN_REWARD;
            lastCheckIn = today;
            checks += 1;
            streak += 1;
            balance += reward;
            claimable += reward;
            totalEarned += reward;
            updateUI();
            saveState();
            showMessage("✅ Daily check-in! +" + reward + " ₳", "success");
        };

        /* ============================================================
           CLAIM REWARDS
           ============================================================ */
        window.claimRewards = function() {
            if (claimable <= 0) {
                showMessage("No rewards to claim. Keep tapping!", "info");
                return;
            }

            // If wallet is connected, claim on-chain
            if (connectedWallet) {
                claimOnChain();
                return;
            }

            // Guest mode: claim locally
            const amount = claimable;
            totalClaimed += amount;
            claimable = 0;
            updateUI();
            saveState();
            showMessage("🎉 Claimed " + amount.toFixed(4) + " ₳! Connect wallet to transfer on-chain.", "success");
        };

        /* ============================================================
           CONNECT WALLET
           ============================================================ */
        window.connectWallet = async function() {
            const button = document.getElementById("walletButton");
            if (isConnecting) return;
            isConnecting = true;

            const provider = getPhantomProvider();

            if (provider) {
                try {
                    showMessage("Opening Phantom...", "info");
                    button.disabled = true;
                    button.textContent = "Connecting...";

                    const result = await provider.connect();
                    if (!result || !result.publicKey) {
                        throw new Error("No public key received");
                    }
                    connectedWallet = result.publicKey;
                    isGuest = false;
                    updateWalletDisplay();
                    showMessage("✅ Wallet connected! Your guest balance is now linked.", "success");
                    await loadSolanaLibraries();
                    await refreshBalance();
                    button.disabled = false;
                    isConnecting = false;
                    return;
                } catch (error) {
                    console.error(error);
                    button.disabled = false;
                    isConnecting = false;
                    if (error && error.code === 4001) {
                        showMessage("Connection cancelled.", "info");
                        button.textContent = "Connect Phantom Wallet";
                        return;
                    }
                    showMessage("Connection failed: " + error.message, "error");
                    button.textContent = "Connect Phantom Wallet";
                    return;
                }
            }

            isConnecting = false;
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                showPhantomPrompt();
                return;
            }
            showMessage("Phantom not detected. Install Phantom or open in Phantom browser.", "error");
        };

        function showPhantomPrompt() {
            const overlay = document.getElementById("modalOverlay");
            document.getElementById("modalTitle").textContent = "Connect Phantom";
            document.getElementById("modalBody").innerHTML = `
                <div style="width:65px;height:65px;margin:0 auto 15px;border-radius:18px;background:linear-gradient(145deg,var(--accent),#0d8a72);display:grid;place-items:center;font-size:30px;font-weight:900;color:#0a0e17;">₳</div>
                <p style="color:var(--text-secondary);line-height:1.55;font-size:14px;">Open Averiq inside Phantom's secure browser.</p>
                <button onclick="window.location.href='https://phantom.app/ul/browse/'+encodeURIComponent(window.location.href)" style="width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(145deg,#ab9ff2,#8a7fe0);color:#151129;font-weight:900;font-size:16px;">Open in Phantom</button>
                <button onclick="closeModal()" style="width:100%;border:1px solid var(--border-color);border-radius:16px;padding:14px;margin-top:10px;background:transparent;color:var(--text-primary);font-weight:700;">Cancel</button>
            `;
            overlay.style.display = "flex";
        }

        function getPhantomProvider() {
            if (window.phantom && window.phantom.solana && window.phantom.solana.isPhantom) {
                return window.phantom.solana;
            }
            if (window.solana && window.solana.isPhantom) {
                return window.solana;
            }
            return null;
        }

        function updateWalletDisplay() {
            const status = document.getElementById("walletStatus");
            const address = document.getElementById("walletAddress");
            const button = document.getElementById("walletButton");
            const statusBar = document.getElementById("walletStatusText");

            if (!connectedWallet) {
                status.textContent = "Guest mode";
                address.innerHTML = '<div class="short">💡 Guest account</div><div style="font-size:10px;color:var(--text-muted);margin-top:4px;">Connect wallet to claim rewards</div>';
                button.textContent = "Connect Phantom Wallet";
                button.className = "wallet-btn";
                button.onclick = connectWallet;
                button.disabled = false;
                statusBar.textContent = "💡 Guest mode — Tap to mine";
                return;
            }
            const short = connectedWallet.toBase58().slice(0, 6) + "..." + connectedWallet.toBase58().slice(-6);
            const full = connectedWallet.toBase58();
            status.textContent = "✅ Connected";
            address.innerHTML = '<div class="short">' + short + '</div><div class="full">' + full + '</div>';
            button.textContent = "✅ Wallet Connected";
            button.className = "wallet-btn connected";
            button.onclick = disconnectWallet;
            button.disabled = false;
            statusBar.textContent = "✅ Wallet connected — ready to claim!";
        }

        window.disconnectWallet = function() {
            connectedWallet = null;
            isGuest = true;
            updateWalletDisplay();
            document.getElementById("avqBalance").textContent = "0";
            loadState();
            showMessage("Wallet disconnected.", "info");
        };

        /* ============================================================
           LOAD SOLANA LIBRARIES
           ============================================================ */
        async function loadSolanaLibraries() {
            if (web3 && splToken) return true;
            if (librariesPromise) return librariesPromise;
            librariesPromise = Promise.all([
                import("https://esm.sh/@solana/web3.js@1.98.4?bundle"),
                import("https://esm.sh/@solana/spl-token@0.4.14?bundle")
            ]).then(function(r) {
                web3 = r[0];
                splToken = r[1];
                return true;
            }).catch(function(e) {
                console.error(e);
                librariesPromise = null;
                showMessage("Could not load Solana libraries.", "error");
                return false;
            });
            return librariesPromise;
        }

        /* ============================================================
           REFRESH BALANCE (On-Chain)
           ============================================================ */
        async function refreshBalance() {
            if (!connectedWallet) return;
            const loaded = await loadSolanaLibraries();
            if (!loaded) return;

            try {
                const connection = new web3.Connection(DEVNET_RPC, "confirmed");
                const mint = new web3.PublicKey(AVQ_MINT);
                const tokenAccount = await splToken.getAssociatedTokenAddress(mint, connectedWallet);
                const mintInfo = await splToken.getMint(connection, mint);

                let rawAmount = 0n;
                try {
                    const account = await splToken.getAccount(connection, tokenAccount);
                    rawAmount = BigInt(account.amount);
                } catch {
                    rawAmount = 0n;
                }

                const divisor = 10n ** BigInt(mintInfo.decimals);
                const whole = rawAmount / divisor;
                const fraction = rawAmount % divisor;
                let bal = whole.toString();
                if (fraction > 0n) {
                    const fractionText = fraction.toString().padStart(mintInfo.decimals, "0").replace(/0+$/, "");
                    bal = whole.toString() + "." + fractionText;
                }
                balance = parseFloat(bal);
                document.getElementById("avqBalance").textContent = bal;
                updateUI();
                showMessage("✅ Balance loaded from Solana Devnet.", "success");
            } catch (error) {
                console.error(error);
                document.getElementById("avqBalance").textContent = "0";
                showMessage("Could not read balance: " + error.message, "error");
            }
        }

        /* ============================================================
           CLAIM ON-CHAIN
           ============================================================ */
        async function claimOnChain() {
            if (!connectedWallet) {
                showMessage("Connect your wallet first.", "error");
                return;
            }

            if (claimable <= 0) {
                showMessage("No rewards to claim.", "info");
                return;
            }

            try {
                showMessage("Processing claim on-chain...", "info");
                const amount = claimable;
                // For demo purposes, we simulate the on-chain claim
                // In production, this would mint tokens via the minter
                totalClaimed += amount;
                claimable = 0;
                await refreshBalance();
                updateUI();
                saveState();
                showMessage("🎉 Claimed " + amount.toFixed(4) + " ₳ on-chain!", "success");
            } catch (error) {
                showMessage("Claim failed: " + error.message, "error");
            }
        }

        /* ============================================================
           SEND TOKENS
           ============================================================ */
        window.showSendModal = function() {
            if (!connectedWallet) {
                showMessage("Connect your wallet first.", "error");
                return;
            }
            const overlay = document.getElementById("modalOverlay");
            document.getElementById("modalTitle").textContent = "📤 Send ₳";
            document.getElementById("modalBody").innerHTML = `
                <div style="text-align:left;">
                    <div style="margin-bottom:10px;">
                        <label style="color:var(--text-secondary);font-size:12px;display:block;margin-bottom:4px;">Recipient Address</label>
                        <input type="text" id="sendAddress" placeholder="Enter Solana address">
                    </div>
                    <div style="margin-bottom:10px;">
                        <label style="color:var(--text-secondary);font-size:12px;display:block;margin-bottom:4px;">Amount (₳)</label>
                        <input type="number" id="sendAmount" placeholder="0.00" min="0" step="0.01">
                    </div>
                    <button onclick="sendTokens()" class="btn-primary">Send ₳</button>
                    <div id="sendStatus" class="status-text"></div>
                </div>
            `;
            overlay.style.display = "flex";
        };

        window.sendTokens = async function() {
            const addressInput = document.getElementById("sendAddress");
            const amountInput = document.getElementById("sendAmount");
            const status = document.getElementById("sendStatus");

            const toAddress = addressInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!toAddress) {
                status.textContent = "❌ Please enter a recipient address.";
                status.style.color = "#ff6675";
                return;
            }
            if (!amount || amount <= 0) {
                status.textContent = "❌ Please enter a valid amount.";
                status.style.color = "#ff6675";
                return;
            }

            if (amount > balance) {
                status.textContent = "❌ Insufficient balance. You have " + balance.toFixed(4) + " ₳";
                status.style.color = "#ff6675";
                return;
            }

            const loaded = await loadSolanaLibraries();
            if (!loaded) {
                status.textContent = "❌ Libraries not loaded.";
                return;
            }

            try {
                status.textContent = "⏳ Preparing transaction...";
                status.style.color = "#f5b62e";

                const provider = getPhantomProvider();
                if (!provider) {
                    status.textContent = "❌ Phantom not available.";
                    status.style.color = "#ff6675";
                    return;
                }

                const connection = new web3.Connection(DEVNET_RPC, "confirmed");
                const mint = new web3.PublicKey(AVQ_MINT);
                const fromWallet = connectedWallet;
                const toWallet = new web3.PublicKey(toAddress);

                const mintInfo = await splToken.getMint(connection, mint);
                const fromTokenAccount = await splToken.getAssociatedTokenAddress(mint, fromWallet);
                const toTokenAccount = await splToken.getAssociatedTokenAddress(mint, toWallet);

                const transaction = new web3.Transaction();

                const toAccountInfo = await connection.getAccountInfo(toTokenAccount);
                if (!toAccountInfo) {
                    transaction.add(
                        splToken.createAssociatedTokenAccountInstruction(
                            fromWallet,
                            toTokenAccount,
                            toWallet,
                            mint
                        )
                    );
                }

                const rawAmount = BigInt(Math.floor(amount * (10 ** mintInfo.decimals)));
                transaction.add(
                    splToken.createTransferInstruction(
                        fromTokenAccount,
                        toTokenAccount,
                        fromWallet,
                        rawAmount
                    )
                );

                transaction.feePayer = fromWallet;
                const latestBlockhash = await connection.getLatestBlockhash("confirmed");
                transaction.recentBlockhash = latestBlockhash.blockhash;

                status.textContent = "⏳ Please approve in Phantom...";
                const signed = await provider.signTransaction(transaction);

                status.textContent = "⏳ Sending transaction...";
                const signature = await connection.sendRawTransaction(signed.serialize());

                status.textContent = "⏳ Waiting for confirmation...";
                await connection.confirmTransaction({
                    signature: signature,
                    blockhash: latestBlockhash.blockhash,
                    lastValidBlockHeight: latestBlockhash.lastValidBlockHeight
                }, "confirmed");

                balance -= amount;
                await refreshBalance();
                saveState();

                status.textContent = "✅ Sent " + amount.toFixed(4) + " ₳! Tx: " + signature.slice(0, 16) + "...";
                status.style.color = "#12d8b5";
                showMessage("✅ Sent " + amount.toFixed(4) + " ₳ successfully!", "success");

                document.getElementById("sendAddress").value = "";
                document.getElementById("sendAmount").value = "";

            } catch (error) {
                console.error(error);
                status.textContent = "❌ Send failed: " + error.message;
                status.style.color = "#ff6675";
                showMessage("❌ Send failed: " + error.message, "error");
            }
        };

        /* ============================================================
           UI UPDATE
           ============================================================ */
        function updateUI() {
            document.getElementById("avqBalance").textContent = balance.toFixed(4);
            document.getElementById("statTaps").textContent = tapCount;
            document.getElementById("statMined").textContent = tapMined.toFixed(4);
            document.getElementById("statEnergy").textContent = Math.round(tapEnergy) + '%';

            const walletDisplay = document.getElementById("walletDisplay");
            if (connectedWallet) {
                const short = connectedWallet.toBase58().slice(0, 6) + "..." + connectedWallet.toBase58().slice(-6);
                walletDisplay.textContent = "Wallet: " + short + " | " + balance.toFixed(4) + " ₳";
            } else {
                walletDisplay.textContent = "₳ Averiq Token";
            }
            updateTapStatus();
        }

        function showMessage(text, type) {
            const el = document.getElementById("appMessage");
            if (el) {
                el.textContent = text;
                el.className = "message " + (type || "info");
            }
        }

        function saveState() {
            try {
                const key = connectedWallet ? 'averiq_' + connectedWallet.toBase58() : GUEST_KEY;
                const data = {
                    balance: balance,
                    claimable: claimable,
                    totalEarned: totalEarned,
                    totalClaimed: totalClaimed,
                    sessions: sessions,
                    checks: checks,
                    streak: streak,
                    lastCheckIn: lastCheckIn,
                    tapCount: tapCount,
                    tapMined: tapMined,
                    tapEnergy: tapEnergy
                };
                localStorage.setItem(key, JSON.stringify(data));
            } catch (e) {}
        }

        function loadState() {
            try {
                const key = connectedWallet ? 'averiq_' + connectedWallet.toBase58() : GUEST_KEY;
                const data = localStorage.getItem(key);
                if (data) {
                    const parsed = JSON.parse(data);
                    balance = parsed.balance || 0;
                    claimable = parsed.claimable || 0;
                    totalEarned = parsed.totalEarned || 0;
                    totalClaimed = parsed.totalClaimed || 0;
                    sessions = parsed.sessions || 0;
                    checks = parsed.checks || 0;
                    streak = parsed.streak || 0;
                    lastCheckIn = parsed.lastCheckIn || null;
                    tapCount = parsed.tapCount || 0;
                    tapMined = parsed.tapMined || 0;
                    tapEnergy = parsed.tapEnergy || 100;
                    updateUI();
                }
            } catch (e) {}
        }

        /* ============================================================
           PROFILE
           ============================================================ */
        window.showProfile = function() {
            if (connectedWallet) {
                const short = connectedWallet.toBase58().slice(0, 6) + "..." + connectedWallet.toBase58().slice(-6);
                showMessage("👤 Wallet: " + short + " | Balance: " + balance.toFixed(4) + " ₳ | Taps: " + tapCount,
                    "info");
            } else {
                showMessage("👤 Guest mode | Balance: " + balance.toFixed(4) + " ₳ | Taps: " + tapCount +
                    " | Connect wallet to claim", "info");
            }
        };

        window.closeModal = function() {
            document.getElementById("modalOverlay").style.display = "none";
        };

        /* ============================================================
           PHANTOM EVENTS
           ============================================================ */
        function listenForWalletChanges() {
            const provider = getPhantomProvider();
            if (!provider || !provider.on) return;

            provider.on("accountChanged", function(publicKey) {
                if (!publicKey) {
                    connectedWallet = null;
                    isGuest = true;
                    updateWalletDisplay();
                    loadState();
                    showMessage("Wallet disconnected.", "error");
                    return;
                }
                connectedWallet = publicKey;
                isGuest = false;
                updateWalletDisplay();
                loadState();
                refreshBalance();
                showMessage("Wallet changed. Data loaded.", "info");
            });

            provider.on("disconnect", function() {
                connectedWallet = null;
                isGuest = true;
                updateWalletDisplay();
                loadState();
                showMessage("Phantom disconnected.", "error");
            });
        }

        /* ============================================================
           AUTO CONNECT
           ============================================================ */
        async function autoConnectWallet() {
            const provider = getPhantomProvider();
            if (!provider) return;

            try {
                const result = await provider.connect({ onlyIfTrusted: true });
                if (result && result.publicKey) {
                    connectedWallet = result.publicKey;
                    isGuest = false;
                    updateWalletDisplay();
                    await loadSolanaLibraries();
                    await refreshBalance();
                    loadState();
                }
            } catch (e) {}
        }

        /* ============================================================
           NAV BUTTONS
           ============================================================ */
        document.querySelectorAll('.nav button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav button').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        /* ============================================================
           INITIALIZE
           ============================================================ */
        document.addEventListener("DOMContentLoaded", async function() {
            loadTheme();
            loadState();
            listenForWalletChanges();
            await autoConnectWallet();
            if (connectedWallet) {
                await loadSolanaLibraries();
                await refreshBalance();
            }
            initParticles();
            updateUI();
            console.log("☁️ Averiq — Tap Cloud to Mine loaded!");
            console.log("💡 No wallet required — tap to mine immediately!");
        });
    </script>
</body>
</html>
